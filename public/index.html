<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CodeAlpha E-commerce Store">
  <title>ShopEase | E-commerce Store</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/" aria-label="ShopEase home">ShopEase</a>
      <nav class="nav-links">
        <a href="#products">Products</a>
        <a href="#orders" id="ordersLink" hidden>My Orders</a>
        <button class="cart-button" id="cartButton" type="button">Cart <span id="cartCount">0</span></button>
        <button class="auth-button" id="authButton" type="button">Login</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-content">
        <div>
          <span class="eyebrow">CODEALPHA E-COMMERCE STORE</span>
          <h1>Everything you need, in one simple store.</h1>
          <p>Browse products, view details, add items to your cart, and place orders securely.</p>
          <a class="primary-button" href="#products">Shop Now</a>
        </div>
      </div>
    </section>

    <section class="products-section container" id="products">
      <div class="section-heading">
        <div>
          <span class="eyebrow">OUR COLLECTION</span>
          <h2>Latest Products</h2>
        </div>
        <div class="filters">
          <input id="searchInput" type="search" placeholder="Search products..." aria-label="Search products">
          <select id="categorySelect" aria-label="Filter by category">
            <option value="">All categories</option>
          </select>
        </div>
      </div>
      <div id="productsGrid" class="products-grid" aria-live="polite"></div>
      <div id="pagination" class="pagination"></div>
    </section>

    <section class="orders-section container" id="orders" hidden>
      <div class="section-heading">
        <div>
          <span class="eyebrow">ACCOUNT</span>
          <h2>My Orders</h2>
        </div>
      </div>
      <div id="ordersList"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" type="button" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/js/app.js"></script>
</body>
</html>
